name: Build & Push Product Command

on:
  push:
    branches:
      - main
    paths:
      - 'product-command/**'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar build da imagem
        run: docker build -t product-command:test ./product-command

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./product-command
          file: ./product-command/Dockerfile
          push: true
          tags: celiojunior001/product-command:latest