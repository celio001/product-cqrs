name: Build & Push Product Command

on:
  push:
    branches:
      - main
    paths:
      - 'product-command/**' # Dispara caso tenha mudanças nessa pasta
jobs:
  docker:
    needs: build-image-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./product-command # Aponta para a pasta do serviço, para tratar somente esse especifico
          push: true
          tags: celiojunior001/product-command:latest