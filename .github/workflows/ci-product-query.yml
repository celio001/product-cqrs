name: CI Check Product Query

on:
  pull_request:
    branches:
      - main
    paths:
      - 'product-query/**'

jobs:
  validate-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Teste de Build da Imagem (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./product-query
          push: false