services:
  postgres-main:
    image: postgres:18-alpine
    container_name: postgres-main
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product
    volumes:
      - postgres_data_main:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - product-command
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres-dev:
    image: postgres:18-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - product-command
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    
volumes:
  postgres_data_main:
  postgres_data_dev:
networks:
  product-command:
    driver: bridge
