_format_version: "3.0"
_transform: true

services:
  - name: product-command-service
    url: http://product-command:8081
    routes:
      - name: product-command-route
        paths:
          - /api/v1/product
        methods:
          - POST
          - PUT
          - DELETE
        strip_path: false 

  - name: product-query-service
    url: http://product-query:8082
    routes:
      - name: product-query-route
        paths:
          - /api/v1/product
        methods:
          - GET
        strip_path: false
  
plugins:
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
  - name: rate-limiting
    config:
      minute: 5 
      policy: local 