services:
  product-command:
    build:
      context: ./product-command
      dockerfile: Dockerfile
    container_name: product-command
    ports:
      - "8081:8081"
    networks:
      - app-network
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-dev:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      jaeger:
        condition: service_started

  product-query:
    build:
      context: ./product-query
      dockerfile: Dockerfile
    container_name: product-query
    environment:
      SERVICE_NAME: product-query
      SERVICE_VERSION: "1.0.0"
      ENV: development
      KAFKA_BROKERS: kafka1:9092
      KAFKA_PRODUCT_TOPIC: product.created
      KAFKA_PRODUCT_DLQ_TOPIC: product.dlq
      KAFKA_BRAND_TOPIC: brand.created
      KAFKA_CATEGORY_TOPIC: category.created
      MONGO_DB_DSN: "mongodb://root:MongoDB2019!@mongo:27017/?authSource=admin"
      JAEGER_URL: jaeger:4317
    ports:
      - "8082:8082"
    networks:
      - app-network
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      jaeger:
        condition: service_started
      mongo:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: product-worker
    networks:
      - app-network
    environment:
      SERVICE_NAME: worker-sync
      SERVICE_VERSION: 1.0.0
      ENV: development
      KAFKA_BROKERS: kafka1:9092
      KAFKA_PRODUCT_TOPIC: product.created
      KAFKA_PRODUCT_DLQ_TOPIC: product.dlq
      KAFKA_BRAND_TOPIC: brand.created
      KAFKA_CATEGORY_TOPIC: category.created
      MONGO_DB_DSN: mongodb://root:MongoDB2019!@mongo:27017/?authSource=admin
      JAEGER_URL: jaeger:4317
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-dev:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      jaeger:
        condition: service_started
      mongo:
        condition: service_healthy

  postgres-main:
    image: postgres:18-alpine
    container_name: postgres-main
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product
    volumes:
      - postgres_data_main:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  postgres-dev:
    image: postgres:18-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
      image: mongo
      environment:
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: MongoDB2019!
      ports:
        - "27017:27017"
      volumes:
        - mongo_data:/var/lib/mongo/data
      networks:
        - app-network
      healthcheck:
        test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 15s

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" 
      - "4317:4317"   
      - "4318:4318" 
    networks:
      - app-network
    environment:
      - COLLECTOR_OTLP_ENABLED=true
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
  
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - app-network
    command: -config.file=/etc/loki/local-config.yaml
  
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    networks:
      - app-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Senha padrão, o usuário é 'admin'
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - loki
      - jaeger

  kafka1:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "9093:9093"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka1:9092,CONTROLLER://kafka1:9093,EXTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka1:9092,EXTERNAL://127.0.0.1:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - ./kafka1/data:/var/lib/kafka/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka1:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-topics:
    image: confluentinc/cp-kafka:7.8.0 
    depends_on:  
      kafka1:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "create kafka topics"
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
          --topic product.created \
          --partitions 3 \
          --config retention.ms=604800000
        
        echo "create kafka topics"
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
          --topic product.deleted \
          --partitions 3 \
          --config retention.ms=604800000

        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
          --topic brand.created \
          --partitions 3 \
          --config retention.ms=604800000
        
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
          --topic category.created \
          --partitions 3 \
          --config retention.ms=604800000
                
        echo "Topics created"
        kafka-topics --bootstrap-server kafka1:9092 --list 

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-cluster-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092
    depends_on:
      - kafka1
    networks:
      - app-network



networks:
  app-network:
    driver: bridge

volumes:
  postgres_data_main:
  postgres_data_dev:
  mongo_data: