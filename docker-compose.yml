services:
  product-command:
    build:
      context: ./product-command
      dockerfile: Dockerfile
    container_name: product-command
    ports:
      - "8081:8081"
    networks:
      - app-network
    depends_on:
      - postgres-main
      - postgres-dev
      - kafka1
      - jaeger

  product-query:
    build:
      context: ./product-query
      dockerfile: Dockerfile
    container_name: product-query
    ports:
      - "8082:8082"
    networks:
      - app-network
    depends_on:
      - product-command
      - mongo

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: product-worker
    networks:
      - app-network
    depends_on:
      - mongo
      - postgres-main
      - postgres-dev
      - jaeger

  postgres-main:
    image: postgres:18-alpine
    container_name: postgres-main
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product
    volumes:
      - postgres_data_main:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  postgres-dev:
    image: postgres:18-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
      image: mongo
      environment:
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: MongoDB2019!
      ports:
        - "27017:27017"
      volumes:
        - mongo_data:/var/lib/mongo/data
      networks:
        - mongo-compose-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" 
      - "4317:4317"   
      - "4318:4318"  
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  kafka1:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "9093:9093"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka1:9092,CONTROLLER://kafka1:9093,EXTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka1:9092,EXTERNAL://127.0.0.1:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - ./kafka1/data:/var/lib/kafka/data
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka1:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-topics:
    image: confluentinc/cp-kafka:7.8.0 
    depends_on:  
      kafka1:
        condition: service_healthy
    networks:
      - kafka-net 
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "create kafka topics"
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
          --topic product.created \
          --partitions 3 \
          --config retention.ms=604800000
        
        echo "create kafka topics"
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
          --topic product.deleted \
          --partitions 3 \
          --config retention.ms=604800000

        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
          --topic brand.created \
          --partitions 3 \
          --config retention.ms=604800000
        
        kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
          --topic category.created \
          --partitions 3 \
          --config retention.ms=604800000
                
        echo "Topics created"
        kafka-topics --bootstrap-server kafka1:9092 --list 

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-cluster-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092
    depends_on:
      - kafka1
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge
  mongo-compose-network:
    driver: bridge
  app-network:
    driver: bridge

volumes:
  postgres_data_main:
  postgres_data_dev:
  mongo_data: